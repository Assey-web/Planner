<style>
/* Layout: one phone-width column, content in stacked cards, a five-tab bar fixed to the bottom edge. */
:root {
  --bg: #f5f1fc;
  --surface: #ffffff;
  --surface2: #ede7f9;
  --accent: #7a58c9;
  --accent-soft: #d9cff2;
  --on-accent: #ffffff;
  --text: #29233f;
  --muted: #756e8d;
  --line: #e0d8f0;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131f; --surface: #221d31; --surface2: #2d2742; --accent: #b8a1f2;
    --accent-soft: #3c3360; --on-accent: #1b1530; --text: #ede9f8; --muted: #a79fc3; --line: #373050;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131f; --surface: #221d31; --surface2: #2d2742; --accent: #b8a1f2;
  --accent-soft: #3c3360; --on-accent: #1b1530; --text: #ede9f8; --muted: #a79fc3; --line: #373050;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.45 var(--body);
  padding-block: 4px 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .chk input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px 0; min-height: 36px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: 700 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.brand svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#status { font-size: 12px; color: var(--muted); }
h1 { font: 700 30px/1.1 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
.cap { font: 700 11px/1 var(--body); letter-spacing: .13em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 14px; }
.card.tint { background: var(--surface2); border-color: transparent; }
.hero { padding-top: 14px; }
.nav { display: flex; align-items: center; gap: 10px; }
.nav .ttl { flex: 1; min-width: 0; }
.icn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 22px; line-height: 1; flex: none; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--accent); }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; }
.btn.small { padding: 9px 14px; font-size: 14px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 10px 0; }
.bar { height: 10px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
.strip button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 2px; position: relative; min-height: 56px; }
.strip small { font-size: 11px; color: var(--muted); font-weight: 600; }
.strip b { font-size: 17px; font-variant-numeric: tabular-nums; }
.strip .on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.strip .on small { color: var(--on-accent); opacity: .85; }
.strip .tdy:not(.on) { border-color: var(--accent); }
.strip .has::after, .cell.has::after { content: ""; position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.strip .on.has::after { background: var(--on-accent); }
.row { display: flex; align-items: center; gap: 6px; min-height: 48px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:focus-within { border-bottom-color: var(--accent); }
.chk { position: relative; width: 40px; height: 40px; flex: none; display: grid; place-items: center; margin-left: -6px; }
.chk input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chk span { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--accent-soft); background: var(--surface); position: relative; transition: background .15s, border-color .15s; }
.chk span::after { content: ""; position: absolute; left: 7px; top: 2px; width: 6px; height: 12px; border: solid var(--on-accent); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); opacity: 0; }
.chk input:checked + span { background: var(--accent); border-color: var(--accent); }
.chk input:checked + span::after { opacity: 1; }
.txt, .hn { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: inherit; padding: 12px 0; outline: none; border-radius: 0; }
::placeholder { color: var(--muted); opacity: .6; }
.row:has(.chk input:checked) .txt { text-decoration: line-through; color: var(--muted); }
.x { width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 20px; border-radius: 50%; flex: none; }
.ta { width: 100%; border: 1px solid var(--line); background: var(--surface2); border-radius: 14px; padding: 12px; font: inherit; color: inherit; min-height: 104px; resize: vertical; }
.card.tint .ta { background: var(--surface); }
.field { width: 100%; border: 1px solid var(--line); background: var(--surface2); border-radius: 12px; padding: 11px 12px; font: inherit; color: inherit; min-width: 0; }
.hr { display: grid; grid-template-columns: 58px 1fr 40px; align-items: center; border-bottom: 1px solid var(--line); border-radius: 0; }
.hr:last-child { border-bottom: 0; }
.hr label { color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; padding-left: 2px; }
.hr:has(.chk input:checked) .txt { text-decoration: line-through; color: var(--muted); }
.hr .chk { margin-left: 0; }
.hr.now { background: var(--accent-soft); border-radius: 10px; border-bottom-color: transparent; }
.hr.now label { color: var(--text); }
.hr:focus-within { border-bottom-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cups { display: flex; gap: 6px; flex-wrap: wrap; }
.cups button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent-soft); background: var(--surface); }
.cups button.on { background: var(--accent); border-color: var(--accent); }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.moods button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.moods button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dayrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
.dayrow:last-child { border-bottom: 0; }
.dayrow .h { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.dayrow .h b { font-size: 16px; }
.dayrow .h span { color: var(--muted); font-size: 14px; margin-left: 6px; }
.chip { font-size: 12px; font-weight: 700; background: var(--surface2); color: var(--accent); border-radius: 99px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.dayrow .txt { padding: 8px 0; border-bottom: 1px dashed var(--line); width: 100%; }
.dow, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dow { margin-top: 16px; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
.cal { margin-top: 6px; }
.cell { position: relative; aspect-ratio: 1; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; font-weight: 600; font-variant-numeric: tabular-nums; display: grid; place-items: center; padding-bottom: 6px; }
.cell.today { border: 2px solid var(--accent); color: var(--accent); }
.scroll { overflow-x: auto; margin: 0 -8px; padding: 0 8px; }
.hab { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 420px; }
.hab th, .hab td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); height: 44px; }
.hab thead th { height: 52px; position: sticky; top: 0; background: var(--surface); }
.hab .hn { width: 100%; min-width: 0; text-align: center; font-size: 12px; font-weight: 600; padding: 6px 2px; }
.hab .chk { margin: 0 auto; }
.hab .dc { position: sticky; left: 0; background: var(--surface); width: 52px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; z-index: 1; text-align: left; padding-left: 4px; }
.hab .dc b { color: var(--text); }
.hab tr.tdr td, .hab tr.tdr .dc { background: var(--accent-soft); }
.hab tfoot td { font-weight: 700; color: var(--accent); font-size: 13px; border-bottom: 0; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.stat small { color: var(--muted); font-size: 12px; font-weight: 600; }
.stat b { display: block; font: 700 22px/1.2 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.pair:last-of-type { border-bottom: 0; }
.pair .txt:last-child { text-align: right; }
.log { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log .d { color: var(--muted); font-size: 13px; }
.log b { font-variant-numeric: tabular-nums; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.form .wide { grid-column: 1 / -1; }
.menu { display: grid; gap: 10px; margin-top: 16px; }
.menu button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 2px; }
.menu b { font: 700 18px/1.2 var(--display); }
.menu span { color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.back { margin-top: 8px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 6px 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 14px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabs svg .f { fill: currentColor; stroke: none; }
@media (prefers-reduced-motion: reduce) { .bar i, .chk span { transition: none; } }
</style>

<div class="wrap">
  <div class="top"><span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M3 10h18M8 2.5v3M16 2.5v3M8.5 15.5l2.5 2.5 4.5-5"/></svg>Planner</span><span id="status" role="status"></span></div>
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Sections"><div>
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>Today</button>
  <button data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-tab="month"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Month</button>
  <button data-tab="habits"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Habits</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.7"/><circle class="f" cx="12" cy="12" r="1.7"/><circle class="f" cx="19" cy="12" r="1.7"/></svg>More</button>
</div></nav>

<script>
(function () {
  var $app = document.getElementById('app');
  var LS = 'lavender-planner-v1';
  var DAYN = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var MOODS = ['Low', 'Meh', 'Okay', 'Good', 'Great'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return fmt(d); }
  function mondayOf(s) { var d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmt(d); }
  function dim(y, m) { return new Date(y, m, 0).getDate(); }
  function addMonths(ym, n) { var p = ym.split('-').map(Number); var d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function todayS() { return fmt(new Date()); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hourLabel(h) { return h === 12 ? '12 PM' : h < 12 ? h + ' AM' : (h - 12) + ' PM'; }
  function num(v) { var n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  function nf(n) { return n.toLocaleString(undefined, { maximumFractionDigits: 2 }); }

  /* ---------- defaults ---------- */
  function blank(n) { var a = []; for (var i = 0; i < n; i++) a.push({ t: '', d: false }); return a; }
  function newSettings() {
    var g = []; for (var i = 0; i < 3; i++) g.push({ t: '', why: '', s1: '', d1: false, s2: '', d2: false, due: '' });
    var h = []; for (i = 0; i < 8; i++) h.push('');
    var y = []; for (i = 0; i < 12; i++) y.push('');
    return { habits: h, word: '', vision: '', goals: g, year: y, notes: [] };
  }
  function newMonth() {
    var inc = [], plan = [], i;
    for (i = 0; i < 5; i++) inc.push({ s: '', a: '' });
    for (i = 0; i < 10; i++) plan.push({ i: '', b: '' });
    return { days: {}, weeks: {}, habits: {}, focus: blank(3), notes: '', income: inc, plan: plan, log: [] };
  }
  function newDay() { return { pri: blank(3), sched: {}, schedD: {}, todo: blank(6), water: 0, mood: 0, note: '' }; }
  function newWeek() { var d = []; for (var i = 0; i < 7; i++) d.push(''); return { pri: blank(3), days: d, todo: blank(6), notes: '' }; }

  /* ---------- storage ---------- */
  var store = { settings: null, months: {}, dirty: {}, col: null, pulled: {}, saving: false, timer: null, retry: null };
  var STATUS = { saved: 'Saved', saving: 'Saving…', local: 'Saved on this phone', error: 'Not synced, retrying' };
  function setStatus(k) { var el = document.getElementById('status'); if (el) el.textContent = STATUS[k] || ''; }
  function loadLocal() {
    try {
      var j = JSON.parse(localStorage.getItem(LS) || 'null');
      if (j) { store.settings = j.settings || null; store.months = j.months || {}; }
    } catch (e) { }
    if (!store.settings) store.settings = newSettings();
  }
  function saveLocal() {
    try {
      var out = { settings: store.settings._u ? store.settings : null, months: {} };
      for (var k in store.months) if (store.months[k]._u) out.months[k] = store.months[k];
      localStorage.setItem(LS, JSON.stringify(out));
    } catch (e) { }
  }
  function getMonth(ym) {
    if (!store.months[ym]) { store.months[ym] = newMonth(); pull('m-' + ym); }
    return store.months[ym];
  }
  function getDoc(key) { return key === 'settings' ? store.settings : getMonth(key.slice(2)); }
  function markDirty(key, keepStamp) {
    var doc = getDoc(key);
    if (!keepStamp) doc._u = Date.now();
    store.dirty[key] = true;
    saveLocal();
    setStatus(store.col ? 'saving' : 'local');
    clearTimeout(store.timer);
    store.timer = setTimeout(flush, 700);
  }
  function pending() { return Object.keys(store.dirty).length; }
  function flush() {
    if (store.saving) return;
    if (!store.col) { setStatus('local'); return; }
    store.saving = true;
    var key = null;
    (async function () {
      try {
        while (pending()) {
          key = Object.keys(store.dirty)[0];
          delete store.dirty[key];
          await store.col.doc(key).set(JSON.parse(JSON.stringify(getDoc(key))));
          key = null;
        }
        setStatus('saved');
      } catch (e) {
        if (key) store.dirty[key] = true;
        setStatus('error');
        clearTimeout(store.retry);
        store.retry = setTimeout(flush, 20000);
      } finally { store.saving = false; }
    })();
  }
  async function pull(key) {
    if (!store.col || store.pulled[key]) return;
    store.pulled[key] = true;
    try {
      var snap = await store.col.doc(key).get();
      var isS = key === 'settings';
      var cur = isS ? store.settings : store.months[key.slice(2)];
      if (snap.exists) {
        var rd = JSON.parse(JSON.stringify(snap.data()));
        if (!cur || !cur._u || (rd._u || 0) >= cur._u) {
          if (isS) store.settings = Object.assign(newSettings(), rd);
          else store.months[key.slice(2)] = Object.assign(newMonth(), rd);
          saveLocal();
          var a = document.activeElement;
          if (!store.dirty[key] && !(a && /INPUT|TEXTAREA/.test(a.tagName))) render(true);
        } else markDirty(key, true);
      } else if (cur && cur._u) markDirty(key, true);
    } catch (e) { store.pulled[key] = false; }
  }
  async function initRemote() {
    try {
      if (!window.claude || !window.claude.use) return;
      var got = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
      var user = got[0], db = got[1];
      if (!user || !db) return;
      var id = await user.id();
      if (!id) return;
      store.col = db.collection('data/users/' + id);
      setStatus(pending() ? 'saving' : 'saved');
      await pull('settings');
      var ks = Object.keys(store.months);
      for (var i = 0; i < ks.length; i++) await pull('m-' + ks[i]);
      if (pending()) flush();
    } catch (e) { }
  }

  /* ---------- state helpers ---------- */
  function walk(key, path) {
    var doc = getDoc(key), p = path.split('.');
    if (p[0] === 'days' && !doc.days[p[1]]) doc.days[p[1]] = newDay();
    if (p[0] === 'weeks' && !doc.weeks[p[1]]) doc.weeks[p[1]] = newWeek();
    var o = doc;
    for (var i = 0; i < p.length - 1; i++) { if (o[p[i]] == null) o[p[i]] = {}; o = o[p[i]]; }
    return [o, p[p.length - 1]];
  }
  function setPath(key, path, val) { var w = walk(key, path); w[0][w[1]] = val; markDirty(key); }

  /* ---------- navigation ---------- */
  var T0 = todayS();
  var nav = { tab: 'today', sub: null, date: T0, ym: T0.slice(0, 7), wk: mondayOf(T0) };

  function B(doc, path) { return 'data-doc="' + doc + '" data-path="' + esc(path) + '"'; }
  function check(doc, path, on, label) {
    return '<label class="chk"><input type="checkbox" aria-label="' + esc(label || 'Done') + '" ' + B(doc, path) + (on ? ' checked' : '') + '><span></span></label>';
  }
  function taskRow(doc, base, it, ph, removable, i, arrPath) {
    return '<div class="row">' + check(doc, base + '.d', it.d) +

      arr.push(D.kind === 'note' ? { id: Date.now().toString(36), t: '', b: '' } : { t: '', d: false });
      markDirty(D.doc); render(true);
      var f = document.querySelector('[data-doc="' + D.doc + '"][data-path="' + D.path + '.' + (arr.length - 1) + (D.kind === 'note' ? '.t' : '.t') + '"]');
      if (f) f.focus();
    }
    else if (a === 'del') {
      var w2 = walk(D.doc, D.path); w2[0][w2[1]].splice(+D.i, 1); markDirty(D.doc); render(true); updateProgress();
    }
    else if (a === 'addlog') {
      var amt = document.getElementById('lg-a').value, desc = document.getElementById('lg-t').value, dt = document.getElementById('lg-d').value;
      if (!num(amt) && !desc.trim()) return;
      var mm = getMonth(nav.ym);
      mm.log.push({ d: dt && dt.slice(0, 7) === nav.ym ? dt : nav.ym + '-01', t: desc.trim(), c: document.getElementById('lg-c').value.trim(), a: String(num(amt)) });
      markDirty('m-' + nav.ym); render(true);
    }
  });

  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  } catch (e) { }
  loadLocal();
  render(false);
  setStatus('local');
  initRemote();
})();
</script>
